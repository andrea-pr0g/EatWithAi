[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eatwithai"
version = "1.0.0"
description = "AI-powered Restaurant Reservation Assistant with PostgreSQL and Google Gemini"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "EatWithAi Team"}
]
keywords = [
    "restaurant",
    "reservations",
    "ai",
    "gemini",
    "llm",
    "postgresql",
    "chatbot"
]
dependencies = [
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.1",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
eatwithai = "eatwithai.cli:main"
eatwithai-init-db = "eatwithai.cli:init_db_main"
eatwithai-chat = "eatwithai.chatbot.agent:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
